# AdCore — Nginx. Panel domaini + sınırsız reklam domaini (Host başlığı ile eşleşir).
# Statik frontend build: __APP_DIR__/frontend/dist ; API: 127.0.0.1:8001

upstream adcore_api { server 127.0.0.1:8001; }

# 1) Backoffice paneli
server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_DOMAIN__ www.__PANEL_DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;
    client_max_body_size 12M;          # 10 MB logo yüklemeleri için

    location /api/ {
        proxy_pass http://adcore_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /index.html; }

    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# 2) Reklam domainleri — panelden eklenen TÜM domainler buraya düşer.
#    Uygulama gelen Host başlığına göre ilgili sitenin tasarımını gösterir.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://adcore_api;
        proxy_set_header Host $host;      # domain eşleme için ZORUNLU
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel yolları reklam domainlerinde kapalı olsun
    location /admin { return 404; }

    # Arama motoru dosyaları: backend Host başlığına göre üretir (her domain kendi içeriğini alır).
    location = /robots.txt {
        proxy_pass http://adcore_api/api/public/robots.txt;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://adcore_api/api/public/sitemap.xml;
        proxy_set_header Host $host;
    }

    location / { try_files $uri $uri/ /index.html; }
}
